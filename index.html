<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="google-site-verification" content="5MsDsTAwtGw6vur-L1tL4IPjLOmzUAmjDEpChKCidmc" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Preload Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-render-blocking: loads as "print" then flips to "all" (noscript fallback below) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    </noscript>

    <!-- Default SEO (overridden per-page by react-helmet-async) -->
    <title>Filedit – Free PDF & Image Tools Online</title>
    <meta name="description" content="Free online tools for PDF compression, merging, splitting, image conversion, background removal, OCR and more. No signup required. Process files instantly in your browser." />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Filedit" />
    <meta property="og:title" content="Filedit – Free PDF & Image Tools Online" />
    <meta property="og:description" content="Professional PDF and image processing tools. Free, fast, and private — files never leave your browser." />
    <meta property="og:url" content="https://filedit.pages.dev" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Filedit – Free PDF & Image Tools Online" />
    <meta name="twitter:description" content="Professional PDF and image processing tools. Free, fast, and private." />

    <!-- Structured Data: Website -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Filedit",
      "url": "https://filedit.pages.dev",
      "description": "Free online document and image processing toolkit",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://filedit.pages.dev/tools?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
